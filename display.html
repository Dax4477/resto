<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Menu</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; padding: 40px; overflow: hidden; }
        h1 { text-align: center; color: #f1c40f; font-size: 3rem; margin-bottom: 40px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 50px; }
        .item { display: flex; justify-content: space-between; border-bottom: 1px dashed #444; padding-bottom: 15px; margin-bottom: 20px; font-size: 28px; }
        .item-details { display: flex; flex-direction: column; }
        .category-label { font-size: 16px; color: #888; text-transform: uppercase; margin-top: 5px; }
        .price { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Today's Menu</h1>
    <div class="menu-grid" id="menu-container">
        <!-- JavaScript will inject menu items here -->
    </div>

    <script>
        async function loadMenu() {
            try {
                // The ?t= prevents the TV browser from caching the old prices
                const response = await fetch('menu.json?t=' + new Date().getTime());
                const menu = await response.json();
                
                let html = '';
                menu.forEach(item => {
                    html += `
                        <div class="item">
                            <div class="item-details">
                                <span>${item.name}</span>
                                <span class="category-label">${item.category}</span>
                            </div>
                            <span class="price">₹${item.price}</span>
                        </div>
                    `;
                });
                document.getElementById('menu-container').innerHTML = html;
            } catch (error) {
                console.error("Error loading menu:", error);
            }
        }

        // Load immediately, then refresh the data every 60 seconds
        loadMenu();
        setInterval(loadMenu, 60000); 
    </script>
</body>
</html>
